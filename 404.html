<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11131c" media="(prefers-color-scheme: dark)">
  <title>页面未找到 / Page not found</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7fb;
      --surface: rgba(255, 255, 255, 0.9);
      --text: #191b28;
      --muted: #626779;
      --line: rgba(49, 55, 84, 0.15);
      --accent: #4358e8;
      --shadow: 0 18px 54px rgba(41, 47, 86, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background:
        radial-gradient(circle at 10% 5%, rgba(67, 88, 232, 0.1), transparent 28rem),
        var(--page);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      text-size-adjust: 100%;
    }

    main {
      width: min(100%, 640px);
      padding: clamp(30px, 7vw, 56px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .code {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0.08em;
    }

    h1,
    h2 {
      margin-top: 0;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(36px, 8vw, 54px);
    }

    h2 {
      margin-bottom: 10px;
      font-size: 23px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .english {
      margin-top: 30px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11131c;
        --surface: rgba(26, 29, 44, 0.9);
        --text: #f2f3fa;
        --muted: #b3b7c9;
        --line: rgba(214, 218, 240, 0.14);
        --accent: #9aa7ff;
        --shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
      }

      body {
        background:
          radial-gradient(circle at 10% 5%, rgba(67, 88, 232, 0.16), transparent 28rem),
          var(--page);
      }
    }

    @media (forced-colors: active) {
      main {
        border-color: CanvasText;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <p class="code">404</p>
    <h1 id="page-title">页面未找到</h1>
    <p>这个地址没有公开页面。请检查完整的项目网址。</p>

    <section class="english" lang="en" aria-labelledby="english-title">
      <h2 id="english-title">Page not found</h2>
      <p>There is no public page at this address. Check the full project URL.</p>
    </section>
  </main>
</body>
</html>
